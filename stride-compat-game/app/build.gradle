plugins { id "com.android.application" }

android {
    namespace "com.stride.compatgame"
    compileSdk 35
    defaultConfig {
        applicationId "com.stride.pocketcalculator"
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
    }
    buildTypes {
        debug { applicationIdSuffix ".debug"; versionNameSuffix "-debug" }
        release {
            minifyEnabled false
        }
    }
}
