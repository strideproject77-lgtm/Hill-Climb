name: Translation layer parser tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm zlib1g-dev
      - name: Run parser and ELF layout tests
        run: sh tests/translation-layer/run.sh

  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Flutter UI
        run: flutter analyze
