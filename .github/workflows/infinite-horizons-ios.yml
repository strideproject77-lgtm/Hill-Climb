name: Infinite Horizons iOS IPA

on:
  workflow_dispatch:
    inputs:
      authorize_ipa_export:
        description: "Explicitly authorize an unsigned iOS IPA build"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - hill-climb-game
    paths:
      - "game/IOS_BUILD_TRIGGER"

permissions:
  contents: read

concurrency:
  group: infinite-horizons-ios-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-ipa:
    if: github.event_name == 'push' || github.event.inputs.authorize_ipa_export == 'true'
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Checkout game branch
        uses: actions/checkout@v4
        with:
          ref: hill-climb-game

      - name: Install Godot 4.4.1 and iOS export templates
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_macos.universal.zip -o "$RUNNER_TEMP/godot-macos.zip"
          mkdir -p "$RUNNER_TEMP/godot-app"
          ditto -x -k "$RUNNER_TEMP/godot-macos.zip" "$RUNNER_TEMP/godot-app"
          APP_PATH="$(find "$RUNNER_TEMP/godot-app" -maxdepth 4 -name Godot.app -print -quit)"
          test -n "$APP_PATH"
          cp -R "$APP_PATH" /Applications/Godot.app
          GODOT_BIN="/Applications/Godot.app/Contents/MacOS/Godot"
          test -x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR" "$RUNNER_TEMP/godot-templates"
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o "$RUNNER_TEMP/godot-templates.tpz"
          unzip -q "$RUNNER_TEMP/godot-templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$TEMPLATE_DIR/"

      - name: Import and smoke-test shared Godot project
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path game --quit
          "$GODOT_BIN" --headless --path game --quit-after 120

      - name: Export unsigned iOS Xcode project
        run: |
          set -euo pipefail
          # Ensure Godot invokes Apple's Xcode toolchain (including codesign)
          # rather than a standalone Command Line Tools selection.
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          xcodebuild -version
          # Verify the codesign tool exists; macOS codesign has no --version flag.
          command -v codesign
          python3 - <<'PY'
          from pathlib import Path
          path = Path("game/export_presets.cfg")
          text = path.read_text()
          old = "application/export_project_only=false"
          new = "application/export_project_only=true"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Could not locate iOS export_project_only setting")

          # Godot validates this field even when exporting an Xcode project
          # that will be compiled with code signing disabled. Use a temporary
          # syntactically valid placeholder; it is not a signing credential.
          team_old = 'application/app_store_team_id=""'
          team_new = 'application/app_store_team_id="0000000000"'
          if team_old in text:
              text = text.replace(team_old, team_new, 1)
          elif team_new not in text:
              raise SystemExit("Could not locate iOS App Store Team ID setting")

          # Godot signs embedded dynamic libraries during iOS project export.
          # Use an ad-hoc identity for those binaries only; Xcode still builds
          # the final app with signing disabled and without a provisioning profile.
          for key in ("application/code_sign_identity_debug", "application/code_sign_identity_release"):
              old_identity = key + '=""'
              new_identity = key + '="-"'
              if old_identity in text:
                  text = text.replace(old_identity, new_identity, 1)
              elif new_identity not in text:
                  raise SystemExit("Could not configure ad-hoc identity for " + key)
          path.write_text(text)
          PY
          rm -rf game/build/ios-project
          mkdir -p game/build
          # Capture codesign stderr through stdout: Godot captures the child
          # process stdout but discards its stderr during embedded dylib signing.
          mkdir -p "$RUNNER_TEMP/stride-codesign-bin"
          cat > "$RUNNER_TEMP/stride-codesign-bin/codesign" <<'SH'
          #!/bin/sh
          printf 'STRIDE_CODESIGN_CALL'
          for arg in "$@"; do printf ' <%s>' "$arg"; done
          printf '\\n'
          /usr/bin/codesign "$@" 2>&1
          exit $?
          SH
          chmod +x "$RUNNER_TEMP/stride-codesign-bin/codesign"
          export PATH="$RUNNER_TEMP/stride-codesign-bin:$PATH"
          echo "Godot iOS dylibs input:"
          find game/godot_ios/dylibs -maxdepth 4 -print 2>/dev/null || true
          # Godot resolves export destinations relative to the project root
          # (game/), not the repository root. Preserve its full editor log.
          set +e
          "$GODOT_BIN" --verbose --log-file "$RUNNER_TEMP/godot-ios-export.log" --headless --path game --export-release "iOS" build/ios-project
          EXPORT_STATUS=$?
          set -e
          echo "Godot export exit code: $EXPORT_STATUS"
          echo "Godot generated files (if any):"
          find game/build/ios-project -maxdepth 5 -print 2>/dev/null | head -250 || true
          if [ -f "$RUNNER_TEMP/godot-ios-export.log" ]; then
            echo "===== GODOT EXPORT LOG (last 500 lines) ====="
            tail -500 "$RUNNER_TEMP/godot-ios-export.log"
          fi
          if [ "$EXPORT_STATUS" -ne 0 ]; then
            exit "$EXPORT_STATUS"
          fi
          # Godot emits the .xcodeproj beside the export data directory:
          # build/ios-project.xcodeproj, not inside build/ios-project/.
          echo "Searching generated Xcode projects under game/build:"
          find game/build -maxdepth 3 -name '*.xcodeproj' -print
          PROJECT="$(find game/build -maxdepth 3 -name '*.xcodeproj' -print -quit)"
          if [ -z "$PROJECT" ]; then
            echo "::error::Godot export completed but no .xcodeproj was found under game/build"
            find game/build -maxdepth 5 -print 2>/dev/null | head -300 || true
            exit 1
          fi
          test -n "$PROJECT"
          echo "IOS_XCODE_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Generated Xcode project: $PROJECT"

      - name: Compile unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild -list -json -project "$IOS_XCODE_PROJECT" > "$RUNNER_TEMP/xcode-list.json"
          SCHEME="$(python3 - "$RUNNER_TEMP/xcode-list.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          schemes = data.get("project", {}).get("schemes", [])
          if not schemes:
              raise SystemExit("No Xcode scheme found in exported Godot project")
          print(schemes[0])
          PY
          )"
          echo "Using Xcode scheme: $SCHEME"
          xcodebuild -project "$IOS_XCODE_PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/InfiniteHorizonsDerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP_PATH="$(find "$RUNNER_TEMP/InfiniteHorizonsDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "IOS_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Verify app and package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$IOS_APP_PATH"
          PLIST="$APP_PATH/Info.plist"
          test -s "$PLIST"
          plutil -lint "$PLIST"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          EXECUTABLE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")
          EXECUTABLE="$APP_PATH/$EXECUTABLE_NAME"
          test "$BUNDLE_ID" = "com.strideproject.openworld"
          test -s "$EXECUTABLE"
          ARCHS="$(lipo -archs "$EXECUTABLE")"
          printf '%s\n' "$ARCHS" | tr ' ' '\n' | grep -Fxq arm64
          STAGING="$RUNNER_TEMP/ih-ipa"
          IPA="$GITHUB_WORKSPACE/Infinite-Horizons-unsigned.ipa"
          rm -rf "$STAGING" "$IPA"
          mkdir -p "$STAGING/Payload"
          ditto "$APP_PATH" "$STAGING/Payload/$(basename "$APP_PATH")"
          cd "$STAGING"
          /usr/bin/zip -qry "$IPA" Payload
          test -s "$IPA"
          unzip -t "$IPA"
          unzip -Z1 "$IPA" | grep -F "Payload/$(basename "$APP_PATH")/Info.plist"
          shasum -a 256 "$IPA"
          ls -lh "$IPA"
          {
            echo "INFINITE HORIZONS — unsigned iOS build"
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Bundle ID: $BUNDLE_ID"
            echo "Executable: $EXECUTABLE_NAME"
            echo "Architectures: $ARCHS"
            echo "Signing: Disabled — unsigned IPA for local sideload signing"
            echo "IPA bytes: $(stat -f%z "$IPA")"
            echo "SHA-256: $(shasum -a 256 "$IPA" | awk '{print $1}')"
          } > "$GITHUB_WORKSPACE/Infinite-Horizons-Build-Report.txt"
          cat "$GITHUB_WORKSPACE/Infinite-Horizons-Build-Report.txt"

      - name: Upload IPA and build report
        uses: actions/upload-artifact@v4
        with:
          name: Infinite-Horizons-unsigned-iOS-\${{ github.run_number }}
          path: |
            Infinite-Horizons-unsigned.ipa
            Infinite-Horizons-Build-Report.txt
          if-no-files-found: error
          retention-days: 14
