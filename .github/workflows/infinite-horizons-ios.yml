name: Infinite Horizons iOS IPA (Manual)

on:
  workflow_dispatch:
    inputs:
      authorize_ipa_export:
        description: "Explicitly authorize signing/exporting an IPA in this run"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  export-ipa:
    if: inputs.authorize_ipa_export == true
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout game branch
        uses: actions/checkout@v4
        with:
          ref: hill-climb-game

      - name: Verify required signing secrets
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISION_PROFILE_BASE64 IOS_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Install Apple signing assets
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/ih-build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/ios-signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios-profile.mobileprovision"
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$IOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install Godot 4.4.1 and iOS export templates
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \\
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_macos.universal.zip \\
            -o "$RUNNER_TEMP/godot-macos.zip"
          mkdir -p "$RUNNER_TEMP/godot-app"
          ditto -x -k "$RUNNER_TEMP/godot-macos.zip" "$RUNNER_TEMP/godot-app"
          APP_PATH="$(find "$RUNNER_TEMP/godot-app" -maxdepth 3 -name Godot.app -print -quit)"
          test -n "$APP_PATH"
          cp -R "$APP_PATH" /Applications/Godot.app
          GODOT_BIN="/Applications/Godot.app/Contents/MacOS/Godot"
          test -x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.4.1.stable"
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz \
            -o "$RUNNER_TEMP/godot-templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot-templates"
          unzip -q "$RUNNER_TEMP/godot-templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$HOME/Library/Application Support/Godot/export_templates/4.4.1.stable/"

      - name: Import and validate shared Godot project
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path game --quit
          "$GODOT_BIN" --headless --path game --quit-after 120

      - name: Configure signing and export signed iOS IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path("game/export_presets.cfg")
          text = path.read_text()
          text = text.replace('application/app_store_team_id=""', f'application/app_store_team_id="{os.environ["IOS_TEAM_ID"]}"')
          text = text.replace('application/provisioning_profile_uuid_release=""', f'application/provisioning_profile_uuid_release="{os.environ["IOS_PROFILE_UUID"]}"')
          path.write_text(text)
          PY
          mkdir -p game/build
          "$GODOT_BIN" --headless --path game --export-release "iOS" game/build/infinite-horizons.ipa
          test -s game/build/infinite-horizons.ipa
          unzip -t game/build/infinite-horizons.ipa

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: infinite-horizons-ios-ipa
          path: game/build/infinite-horizons.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Clean signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  authorization-not-selected:
    if: inputs.authorize_ipa_export != true
    runs-on: ubuntu-latest
    steps:
      - name: Explain safety gate
        run: echo "IPA export was not authorized. No iOS export or signing was performed."
