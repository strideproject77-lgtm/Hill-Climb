name: Hill Climb Android APK

on:
  push:
    branches: [hill-climb-game]
    paths:
      - 'game/**'
      - '.github/workflows/hill-climb-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Export Android ARM64 APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout game branch
        uses: actions/checkout@v4
      - name: Verify toolchain
        run: |
          godot --version
          java -version
          test -d "$ANDROID_HOME"
          command -v keytool
      - name: Install matching Android SDK platform and build tools
        run: |
          set -eux
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools (sdkmanager) were not found under $ANDROID_HOME" >&2
            find "$ANDROID_HOME" -maxdepth 4 -type f | sort | head -200
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$SDKMANAGER" --list_installed
      - name: Validate project import
        run: godot --headless --editor --path game --quit
      - name: Install export templates and configure Android signing
        run: |
          set -eux
          if ! command -v curl >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends curl unzip
          fi
          command -v curl
          command -v unzip
          TEMPLATE_VERSION="4.4.1.stable"
          mkdir -p "$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -o /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION/"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          JAVA_BIN="$(readlink -f "$(command -v javac)")"
          JAVA_HOME_DIR="$(dirname "$(dirname "$JAVA_BIN")")"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_DIR"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -x "$JAVA_HOME_DIR/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -s "$HOME/.android/debug.keystore"
          test -s "$HOME/.config/godot/editor_settings-4.4.tres"
          echo "JAVA_HOME=$JAVA_HOME_DIR"
          echo "ANDROID_HOME=$ANDROID_HOME"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
          ls -lh "$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION/"
      - name: Run Android startup smoke test
        run: |
          set -eux
          godot --headless --verbose --path "$GITHUB_WORKSPACE/game" --quit-after 3
      - name: Export APK
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/game/build"
          test -d "$GITHUB_WORKSPACE/game/build"
          godot --headless --verbose --path "$GITHUB_WORKSPACE/game" --export-debug "Android" "$GITHUB_WORKSPACE/game/build/hill-climb-adventure.apk"
          test -s "$GITHUB_WORKSPACE/game/build/hill-climb-adventure.apk"
      - name: Verify APK archive
        run: |
          set -eux
          test -s "$GITHUB_WORKSPACE/game/build/hill-climb-adventure.apk"
          unzip -t "$GITHUB_WORKSPACE/game/build/hill-climb-adventure.apk"
          unzip -l "$GITHUB_WORKSPACE/game/build/hill-climb-adventure.apk" | grep -E 'lib/arm64-v8a/.*\.so'
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ridgeline-offroad-android-arm64
          path: game/build/hill-climb-adventure.apk
          if-no-files-found: error
          retention-days: 14
