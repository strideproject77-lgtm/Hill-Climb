name: Stride Compatibility Game APK
# Build trigger refreshed for the single-DEX compatibility test.

on:
  push:
    branches:
      - stride-compat-java-game
    paths:
      - 'stride-compat-game/**'
      - '.github/workflows/stride-compat-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stride-compat-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build and verify single-DEX Java Canvas APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout compatibility game
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: |
          set -eux
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Compile debug APK
        working-directory: stride-compat-game
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK, exactly one DEX, manifest and native-library profile
        run: |
          set -eux
          APK="stride-compat-game/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          DEX_COUNT="$(unzip -Z1 "$APK" | grep -Ec '^classes([0-9]+)?\.dex$' || true)"
          echo "DEX count: $DEX_COUNT"
          test "$DEX_COUNT" -eq 1
          unzip -Z1 "$APK" | grep -qx 'classes.dex'
          unzip -Z1 "$APK" | grep -q 'AndroidManifest.xml'
          if unzip -Z1 "$APK" | grep -qE '^lib/.*\.so$'; then
            echo "Unexpected native library in compatibility APK" >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.stride.compatgame.debug'" /tmp/apk-badging.txt
          echo "Verified single-DEX Java Canvas APK with no packaged native libraries."
          ls -lh "$APK"
          sha256sum "$APK"
      - name: Upload compatibility APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Ridge-Lite-Single-DEX-APK
          path: stride-compat-game/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
