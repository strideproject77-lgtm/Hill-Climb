name: Stride Compatibility Game APK

on:
  push:
    branches:
      - stride-compat-java-game
    paths:
      - 'stride-compat-game/**'
      - '.github/workflows/stride-compat-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stride-compat-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build and inspect Java Canvas APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout compatibility game
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: |
          set -eux
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Compile optimized release APK
        working-directory: stride-compat-game
        run: gradle --no-daemon :app:assembleRelease
      - name: Inspect APK DEX and package profile
        working-directory: stride-compat-game
        run: |
          set -eux
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          echo "Inspecting APK: $APK"
          unzip -t "$APK"
          echo "DEX entries:"
          unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\.dex$' || true
          DEX_COUNT="$(unzip -Z1 "$APK" | grep -Ec '^classes([0-9]+)?\.dex$' || true)"
          echo "DEX count: $DEX_COUNT"
          unzip -Z1 "$APK" | grep -q 'AndroidManifest.xml'
          if unzip -Z1 "$APK" | grep -qE '^lib/.*\.so$'; then
            echo "Unexpected native library in APK" >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.stride.compatgame'" /tmp/apk-badging.txt
          ls -lh "$APK"
          sha256sum "$APK"
          test "$DEX_COUNT" -eq 1
          echo "Verified exactly one DEX."
      - name: Upload APK for inspection
        if: always() && hashFiles('stride-compat-game/app/build/outputs/apk/release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Ridge-Lite-Single-DEX-APK
          path: stride-compat-game/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
